# jev-criteria.example.yml — everything Jev is told about how to judge a job
# against the candidate's context.
#
# Copy this file to `config/jev-criteria.yml` in your data root
# (CAREER_OPS_DATA_DIR) and tune the wording freely. The QUESTION KEYS and the
# CHOICE LABELS are the contract: `jev-score.mjs` builds its request from them,
# `jev-rank.mjs` writes them into `data/pipeline.md` rows, and the evaluation
# prompts read them back. Keep those stable; rewrite the sentences.
#
# Question types (OpenRouter decisions API, model typesafe/jev-1.13):
#   choice -> {type: choice, instructions, criteria: {label: description}}
#             answer: {type: choice, choice: label, confidence: 0..1}
#   noul   -> {type: noul, instructions}
#             answer: {type: noul, noul: 0..1}  (a probability, scaled to 0..100 as `fit`)
#
# The candidate's profile is sent whole as `state.profile` (your
# `modes/_context.md`, or `cv.md` plus `config/profile.yml` when that file does
# not exist), so every "the profile says" below refers to that text.

preamble: >-
  You are screening job postings for one candidate. The candidate's profile
  (CV summary, target roles, constraints and preferences) is in state.profile.
  The job posting is in state.job. Judge the job strictly against the profile:
  the question is whether this candidate should spend time applying, not
  whether the job is good in general.

# Description text longer than this is cut before it is sent. The relevant
# parts of a posting are almost always in the first few thousand characters.
max_description_chars: 6000

questions:
  fit:
    type: noul
    instructions: >-
      Is this job a strong match for the candidate? Weigh, in this order: role
      level against the level the profile describes, workplace and location
      against the profile's constraints, required languages, team type, stack,
      experience fit, and then team size and scope. Team type: follow the
      profile's stated preference between customer-facing product teams and
      platform, infrastructure or internal teams. Stack: follow the posting's
      own wording. A stack the posting requires is weighted heavily: a match
      with the profile's core stack is a strong plus, a requirement for
      hands-on depth the profile lacks is a strong minus. A stack listed as
      desired or nice-to-have moves the score only a little either way; a
      stack-agnostic role is neutral. Experience fit: give a plus to postings
      that ask for what the profile shows the candidate has done before, and
      a minus to postings built around work the profile marks as a weak area.
      Follow the profile's "Preferences" section for everything it lists as
      blocker, minus, neutral or plus (employment type, relocation,
      consultancies, languages, title level, travel, ways of working). Treat
      a clear mismatch on level, or an impossible location or language
      requirement, as a weak match even when the domain fits. Workplace
      matters a lot: with everything else equal, a remote role ranks above a
      hybrid role with few office days, which ranks above a hybrid role with
      many office days, which ranks above a fully on-site role. Follow the
      profile's own words on how many office days are acceptable.

  verdict:
    type: choice
    instructions: >-
      Should the candidate apply? Use the profile's constraints as hard
      filters and the profile's preferences as soft signals. The core of the
      decision is level, scope and workplace. A business-domain or
      tech-stack gap is not by itself a reason to withhold "apply" when the
      role is otherwise at the profile's level; the full evaluation will list
      the gap. Withhold "apply" for a domain gap only when the posting
      requires deep hands-on expertise in it as a must-have.
    criteria:
      apply: >-
        A role at the level and scope the profile describes, remote or hybrid
        with an office-day count the profile accepts, no language blocker,
        and no stack the posting requires that the profile lacks. A team type
        the profile prefers, or a stack-agnostic role. Desired-but-missing
        skills or an unfamiliar business domain do not disqualify.
      maybe: >-
        Right level but an important unknown or soft problem: workplace not
        stated, more office days than the profile prefers but not ruled out,
        unclear team scope, a team type the profile marks as a minus, a
        required stack the profile lacks when the role is otherwise strong,
        or a way of working the profile marks as a minus.
      skip: >-
        Hard blocker: wrong level (clearly below or clearly above the
        profile), impossible location, fully on-site where the profile rules
        it out, a required or everyday language the profile marks as a
        blocker, or an engagement type the profile rules out (for example
        contractor or freelance when it wants an employee contract).

  seniority_match:
    type: choice
    instructions: >-
      Compare the seniority the job asks for with the candidate's level as
      described in the profile.
    criteria:
      below: >-
        The job is junior to the candidate: a level, scope or responsibility
        clearly below what the profile describes as the target.
      match: >-
        A role at the level and scope the profile describes as the target.
      above: >-
        The job is senior to the candidate: a level, scope or span of
        responsibility beyond what the profile supports.

  location_ok:
    type: choice
    instructions: >-
      Can the candidate do this job from where they live, given the profile's
      location, relocation and remote constraints?
    criteria:
      "yes": >-
        Remote from where the profile allows, or hybrid within the
        candidate's commuting area with an office-day count the profile
        accepts.
      "no": >-
        Requires presence in a place the candidate cannot commute to or
        relocate to, remote only from a country the candidate is not in, or
        fully on-site when the profile says on-site is not acceptable.
      unclear: >-
        The posting does not say where the work happens, whether remote is
        allowed, or how many office days a hybrid role needs.

  language_blocker:
    type: choice
    instructions: >-
      Does the job require, or use day to day, a language the candidate does
      not have at the needed level? Use the profile's language section: it
      says which languages the candidate speaks, at what level, and which
      language situations it treats as a blocker or a minus. A posting
      written in a language is a strong sign that language is the working
      language.
    criteria:
      none: >-
        No language requirement beyond what the profile covers at the needed
        level, and the working language is one the profile lists as fluent.
      missing: >-
        A language the profile does not cover, or marks as a blocker, is
        required, clearly expected, or the everyday working language.
      partial: >-
        The working or required language is one the profile lists below the
        needed level (for example an intermediate level where fluent is
        expected) and the profile treats that as a minus rather than a
        blocker.

  team_type:
    type: choice
    instructions: >-
      What kind of team would the candidate join or lead, according to the
      posting?
    criteria:
      product: >-
        A customer-facing product: web or mobile apps, marketplaces,
        e-commerce, SaaS features, a product team working with product
        managers and designers.
      platform_infra: >-
        Backend-only, SRE, infrastructure, cloud, data platform, security,
        identity, internal developer platform, managed services or
        operations.
      unclear: >-
        The posting does not say what the team builds or for whom.

  stack_fit:
    type: choice
    instructions: >-
      Compare the technologies the posting names with the profile's stack,
      using the posting's own wording for required versus desired.
    criteria:
      required_match: >-
        The posting requires or expects hands-on experience in a stack the
        profile lists as core.
      desired_match: >-
        The posting lists the profile's stack only as desired, nice-to-have
        or a plus, or names it among several acceptable options.
      stack_agnostic: >-
        The posting requires no specific stack, or only a generic
        software-engineering background.
      required_mismatch: >-
        The posting requires hands-on depth in a stack the profile marks as
        an aspiration, as managed-but-not-hands-on, or does not list at all.

# The choice questions whose answers are stored with every job and shown as
# its reasons, in this order.
reason_questions:
  - seniority_match
  - location_ok
  - language_blocker
  - team_type
  - stack_fit

# Answers that make a `skip` verdict a hard stop before the full evaluation
# (modes/_shared.md, "Calibrated pre-screen"). Each label must be one of that
# question's criteria.
blocking_answers:
  seniority_match: [below, above]
  location_ok: ["no"]
  language_blocker: [missing]
  stack_fit: [required_mismatch]
